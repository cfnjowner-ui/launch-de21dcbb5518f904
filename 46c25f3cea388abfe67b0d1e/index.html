<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0d1626">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CFNJ Tools">
<title>CFNJ · Owner Launcher</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1626'/%3E%3Ctext x='32' y='41' font-family='Georgia,serif' font-size='26' font-weight='700' fill='%23d4a35c' text-anchor='middle'%3ECF%3C/text%3E%3C/svg%3E">
<style>
:root{
  --bg:#0b1322; --bg2:#0f1a2e; --card:#132038; --card2:#172742; --line:rgba(212,163,92,.16);
  --gold:#d4a35c; --gold2:#f0c987; --ink:#eef1f6; --mute:#9aa7bd; --dim:#6c7a92;
  --radius:20px;
  --serif: "Iowan Old Style","Palatino Linotype",Palatino,"Book Antiqua",Georgia,"Times New Roman",serif;
  --sans: -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  min-height:100vh; min-height:100dvh; font-family:var(--sans); color:var(--ink); background:var(--bg);
  background-image:
    radial-gradient(1100px 600px at 85% -10%, rgba(212,163,92,.13), transparent 60%),
    radial-gradient(900px 600px at -10% 110%, rgba(64,110,190,.16), transparent 60%),
    linear-gradient(180deg,var(--bg2),var(--bg));
  -webkit-font-smoothing:antialiased;
  padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
.wrap{max-width:620px;margin:0 auto;padding:48px 24px 40px}
header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:38px}
.brand{display:flex;align-items:center;gap:16px}
.mark{
  width:54px;height:54px;border-radius:15px;flex:none;display:grid;place-items:center;
  background:linear-gradient(145deg,#1b2c4b,#0e1830);border:1px solid var(--line);
  box-shadow:0 10px 30px rgba(0,0,0,.35), inset 0 1px 0 rgba(255,255,255,.06);
  font-family:var(--serif);font-weight:700;font-size:22px;letter-spacing:.5px;color:var(--gold);
}
.brand small{display:block;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:var(--gold);font-weight:600;margin-bottom:4px}
.brand b{display:block;font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.2px}
.when{text-align:right;color:var(--mute);font-size:13px;line-height:1.5}
.when strong{display:block;color:var(--ink);font-weight:600;font-size:14px}
.hero{margin-bottom:30px}
.hero h1{font-family:var(--serif);font-weight:600;font-size:clamp(30px,4.6vw,46px);line-height:1.1;letter-spacing:-.2px}
.hero h1 em{font-style:italic;color:var(--gold2)}
.hero p{margin-top:12px;color:var(--mute);font-size:16px;line-height:1.55}
.rule{height:1px;margin:0 0 30px;background:linear-gradient(90deg,var(--gold) 0,rgba(212,163,92,.25) 30%,transparent 80%);opacity:.7}
.grid{display:grid;grid-template-columns:1fr;gap:14px}
.card{
  position:relative;display:grid;grid-template-columns:56px 1fr;column-gap:18px;align-items:center;padding:22px 22px;border-radius:var(--radius);
  text-decoration:none;color:inherit;overflow:hidden;isolation:isolate;
  background:linear-gradient(160deg,var(--card2),var(--card));
  border:1px solid rgba(255,255,255,.07);
  box-shadow:0 1px 0 rgba(255,255,255,.04) inset, 0 18px 40px -18px rgba(0,0,0,.6);
  transition:transform .22s cubic-bezier(.2,.7,.3,1), border-color .22s, box-shadow .22s;
  -webkit-tap-highlight-color:transparent;
}
.card::before{content:"";position:absolute;inset:0;z-index:-1;opacity:0;transition:opacity .25s;
  background:radial-gradient(500px 220px at 0% 0%, rgba(212,163,92,.16), transparent 70%)}
a.card:hover,a.card:focus-visible{transform:translateY(-4px);border-color:rgba(212,163,92,.45);
  box-shadow:0 1px 0 rgba(255,255,255,.05) inset, 0 26px 50px -20px rgba(0,0,0,.7), 0 0 0 1px rgba(212,163,92,.15)}
a.card:hover::before,a.card:focus-visible::before{opacity:1}
a.card:active{transform:translateY(-1px) scale(.99)}
a.card:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
.icon{width:56px;height:56px;border-radius:16px;display:grid;place-items:center;margin:0;grid-row:1 / span 2;color:var(--gold2);
  background:linear-gradient(145deg,rgba(212,163,92,.20),rgba(212,163,92,.06));border:1px solid rgba(212,163,92,.28)}
.icon svg{width:28px;height:28px}
.card h2{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:.1px;margin-bottom:4px}
.card p{color:var(--mute);font-size:14.5px;line-height:1.5}
.foot{grid-column:2;padding-top:12px;display:flex;align-items:center;justify-content:space-between;font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;font-weight:600}
.open{color:var(--gold);display:inline-flex;align-items:center;gap:8px}
.open svg{width:16px;height:16px;transition:transform .22s}
a.card:hover .open svg{transform:translate(3px,-3px)}
.tag{color:var(--dim);font-weight:600}
.card.soon{cursor:default;background:linear-gradient(160deg,rgba(23,39,66,.55),rgba(19,32,56,.45));border-style:dashed;border-color:rgba(255,255,255,.1);box-shadow:none}
.card.soon .icon{color:var(--dim);background:rgba(255,255,255,.03);border-color:rgba(255,255,255,.09)}
.card.soon h2{color:#c3cad7}
.card.soon p{color:var(--dim)}
.pill{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;border-radius:999px;font-size:11px;letter-spacing:.12em;
  color:var(--gold2);background:rgba(212,163,92,.09);border:1px solid rgba(212,163,92,.25)}
.pill::before{content:"";width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.8}
footer{margin-top:40px;padding-top:22px;border-top:1px solid rgba(255,255,255,.06);display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;color:var(--dim);font-size:12.5px}
footer b{color:var(--mute);font-weight:600}
@media (max-width:600px){
  .wrap{padding:26px 16px 28px}
  header{margin-bottom:26px}
  .mark{width:46px;height:46px;font-size:19px;border-radius:13px}
  .brand b{font-size:18px}
  .when{display:none}
  .hero{margin-bottom:22px}
  .hero p{font-size:15px}
  .rule{margin-bottom:20px}
  .grid{gap:12px}
  .card{padding:18px;grid-template-columns:52px 1fr;column-gap:16px;border-radius:18px}
  .icon{width:52px;height:52px;border-radius:15px}
  .icon svg{width:26px;height:26px}
  .card h2{font-size:20px;margin-bottom:3px}
  .card p{font-size:13.5px;line-height:1.4}
  .foot{padding-top:10px;font-size:11.5px}
  .card .foot .tag{display:none}
  footer{flex-direction:column;gap:6px;margin-top:28px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">
      <div class="mark" aria-hidden="true">CF</div>
      <div><small>Closet Factory · New Jersey</small><b>Owner Launcher</b></div>
    </div>
    <div class="when"><strong id="today">&nbsp;</strong>Andrew Kirchner</div>
  </header>

  <section class="hero">
    <h1 id="greet">Your tools, <em>one tap away.</em></h1>
    <p>Sales, operations, coaching, the showroom and 3D. Each opens in a new tab.</p>
  </section>
  <div class="rule"></div>

  <main class="grid" id="grid" aria-label="Tools"></main>

  <footer>
    <span><b>CFNJ</b> · Kirchner Enterprises Inc.</span>
    <span>Private launcher · boards ask for their access code</span>
  </footer>
</div>

<script>
/* ===== EDIT LINKS HERE =====
   url: the live link. Set url to "" (empty) to show the card as "Coming soon".
   Never put an access code in this file. */
var TOOLS = [
  { name:"Sales Board", desc:"Live sales, pace to goal and October targets.", icon:"chart", tag:"Sales",
    url:"https://cfnjowner-ui.github.io/sales-779338170a701e3c/523ddcf24cd018712b5b2d69/" },
  { name:"Opps Status", desc:"Jobs, installs, service and open balances.", icon:"ops", tag:"Operations",
    url:"https://cfnjowner-ui.github.io/ops-6029b46f7839074b/2b6e5a23c8689525cabe9779/" },
  { name:"Designer Coach", desc:"Each designer's goal, pace and coaching focus.", icon:"coach", tag:"Coaching",
    url:"https://cfnjowner-ui.github.io/coach-cf38f2f6a061034a/8b49c1806293037ab896a1af/" },
  { name:"Digital Showroom", desc:"Finishes, hardware and gallery for client visits.", icon:"showroom", tag:"cfnjgallery.com",
    url:"https://cfnjgallery.com/" },
  { name:"SI Companion", desc:"In-home appointment recorder, notes and prompts.", icon:"mic", tag:"Pilot",
    url:"https://companion.cfnjgallery.com/" },
  { name:"Bot Vision", desc:"Interactive 3D designs: open drawers and doors.", icon:"cube", tag:"3D",
    url:"" }
];
/* =========================== */

var ICONS = {
  chart:'<path d="M4 20h16"/><path d="M6 16l4-5 3 3 5-7"/><path d="M15 7h3v3"/>',
  ops:'<rect x="3" y="4" width="18" height="16" rx="2.5"/><path d="M3 9h18"/><path d="M8 13h3M8 16h6"/><path d="M15.5 13.5l1.2 1.2 2.3-2.4"/>',
  coach:'<circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="4.5"/><circle cx="12" cy="12" r="1"/><path d="M18.5 5.5l-4 4"/>',
  showroom:'<path d="M3 21V8l9-5 9 5v13"/><path d="M7 21v-8h10v8"/><path d="M12 13v8"/><path d="M10 17h.01M14 17h.01"/>',
  cube:'<path d="M12 2.8l8 4.6v9.2l-8 4.6-8-4.6V7.4z"/><path d="M4 7.4l8 4.6 8-4.6"/><path d="M12 12v9.2"/>',
  mic:'<rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5.5 11a6.5 6.5 0 0 0 13 0"/><path d="M12 17.5V21M8.5 21h7"/>'
};
var ARROW='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 17L17 7"/><path d="M8 7h9v9"/></svg>';
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
var html="";
TOOLS.forEach(function(t){
  var ic='<div class="icon" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">'+ICONS[t.icon]+'</svg></div>';
  var body='<div><h2>'+esc(t.name)+'</h2><p>'+esc(t.desc)+'</p></div>';
  if(t.url){
    html+='<a class="card" href="'+esc(t.url)+'" target="_blank" rel="noopener noreferrer">'+ic+body+
      '<div class="foot"><span class="open">Open '+ARROW+'</span><span class="tag">'+esc(t.tag)+'</span></div></a>';
  }else{
    html+='<div class="card soon" aria-disabled="true">'+ic+body+
      '<div class="foot"><span class="pill">Coming soon</span><span class="tag">'+esc(t.tag)+'</span></div></div>';
  }
});
document.getElementById("grid").innerHTML=html;
var d=new Date(),h=d.getHours();
document.getElementById("today").textContent=d.toLocaleDateString("en-US",{weekday:"long",month:"long",day:"numeric"});
document.getElementById("greet").innerHTML=(h<12?"Good morning":h<17?"Good afternoon":"Good evening")+", Andrew.<br><em>Your tools, one tap away.</em>";
</script>
</body>
</html>
